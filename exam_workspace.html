<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jupyter 模拟考试工作台</title>
<style>
:root{--top:50px;--split:42%;--bg:#e2e8f0;--nav:#0f172a;--blue:#2563eb;--green:#15803d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:#1f2937}
.topbar{height:var(--top);background:var(--nav);color:#fff;display:flex;align-items:center;gap:9px;padding:0 12px;box-shadow:0 1px 8px rgba(0,0,0,.25);position:relative;z-index:10}.brand{font-weight:700;white-space:nowrap}.meta{font-size:12px;color:#cbd5e1;white-space:nowrap}.spacer{flex:1}.timer{font-family:Consolas,monospace;font-size:20px;font-weight:700;min-width:76px;text-align:center;color:#bfdbfe}.timer.danger{color:#fecaca}
.btn{border:1px solid #475569;background:#1e293b;color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}.btn:hover{background:#334155}.btn.primary{background:var(--blue);border-color:var(--blue)}.btn.submit{background:var(--green);border-color:var(--green)}.btn.answer{background:#92400e;border-color:#b45309}.btn.answer:hover{background:#b45309}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.active{background:#334155;border-color:#93c5fd;color:#dbeafe}
.workspace{height:calc(100vh - var(--top));display:flex;min-width:0;min-height:0;position:relative}.pane{min-width:0;min-height:0;background:#fff;position:relative}.left{flex:0 0 var(--split)}.right{flex:1 1 auto}.pane iframe{display:block;width:100%;height:100%;border:0;background:#fff}.splitter{flex:0 0 8px;background:#cbd5e1;cursor:col-resize;position:relative;z-index:4}.splitter:hover,.splitter.dragging{background:#60a5fa}.splitter:after{content:"";position:absolute;left:2px;top:45%;width:4px;height:48px;border-radius:4px;background:#94a3b8}.workspace.left-hidden .left,.workspace.left-hidden .splitter{display:none}.workspace.right-hidden .right,.workspace.right-hidden .splitter{display:none}.workspace.left-hidden .right,.workspace.right-hidden .left{flex:1 1 100%}
.collapse-controls{position:absolute;top:7px;left:calc(var(--split) - 58px);z-index:8;display:flex;flex-direction:column;gap:5px;transition:left .12s ease,right .12s ease}.collapse-btn{width:46px;height:30px;border:1px solid #94a3b8;border-radius:5px;background:rgba(255,255,255,.94);color:#334155;font-family:Consolas,monospace;font-size:17px;font-weight:700;line-height:26px;text-align:center;cursor:pointer;box-shadow:0 1px 4px rgba(15,23,42,.16);padding:0}.collapse-btn:hover{background:#eff6ff;border-color:#60a5fa;color:#1d4ed8}.collapse-btn.active{background:#dbeafe;border-color:#60a5fa;color:#1d4ed8}.workspace.left-hidden .collapse-controls{left:8px;right:auto}.workspace.right-hidden .collapse-controls{left:auto;right:8px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#475569;z-index:2;font-size:14px}.loading.hidden{display:none}.notice{position:absolute;left:16px;right:16px;top:16px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 12px;border-radius:8px;z-index:5;font-size:13px;display:none}.notice.show{display:block}
.path-panel{display:none;position:fixed;right:14px;top:58px;width:min(460px,calc(100vw - 28px));max-height:72vh;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 18px 50px rgba(15,23,42,.28);z-index:80;overflow:hidden}.path-panel.show{display:flex;flex-direction:column}.path-head{display:flex;align-items:center;gap:10px;padding:11px 13px;background:#f8fafc;border-bottom:1px solid #e2e8f0}.path-title{font-weight:700;flex:1}.path-close{border:0;background:transparent;font-size:20px;cursor:pointer;color:#64748b}.path-help{padding:10px 13px;background:#eff6ff;border-bottom:1px solid #dbeafe;font-size:12px;line-height:1.65;color:#334155}.path-body{padding:10px;overflow:auto;font-size:13px}.path-root{font-family:Consolas,"Microsoft YaHei",monospace;font-weight:700}.tree-row{display:flex;align-items:center;min-height:28px;border-radius:5px;padding-right:6px}.tree-row:hover{background:#f8fafc}.tree-indent{display:inline-block;width:18px;flex:0 0 18px}.tree-icon{width:21px;flex:0 0 21px;text-align:center}.tree-name{font-family:Consolas,"Microsoft YaHei",monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.tree-copy{margin-left:auto;border:1px solid #cbd5e1;background:#fff;color:#475569;border-radius:5px;padding:2px 6px;font-size:11px;cursor:pointer}.tree-current{font-size:11px;background:#dcfce7;color:#166534;border-radius:10px;padding:1px 6px;margin-left:7px}.path-status{padding:12px;color:#64748b}
.answer-mask,.result-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.72);z-index:200;padding:28px}.answer-mask.show,.result-mask.show{display:flex}.answer-dialog,.result-dialog{width:min(1100px,100%);height:min(86vh,900px);margin:auto;background:#fff;border-radius:12px;box-shadow:0 26px 80px rgba(0,0,0,.42);display:flex;flex-direction:column;overflow:hidden}.answer-head,.result-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#111827;color:#fff}.answer-title,.result-title{font-weight:700;flex:1}.answer-body,.result-body{flex:1;overflow:auto;padding:18px 20px}.answer-toolbar,.result-actions{display:flex;gap:8px;padding:9px 14px;background:#f8fafc;border-top:1px solid #e2e8f0}.answer-toolbar{border-top:0;border-bottom:1px solid #e2e8f0}.mode{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:6px;padding:5px 10px;cursor:pointer}.mode.active{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8;font-weight:700}.answer-code{margin:0;white-space:pre-wrap;word-break:break-word;font-family:Consolas,"Cascadia Code","Microsoft YaHei",monospace;font-size:14px;line-height:1.68;background:#f7f7f7;border:1px solid #e5e7eb;border-radius:8px;padding:16px}.answer-code.full{background:#fff}.kw{color:#008000;font-weight:600}.str{color:#ba2121}.com{color:#408080;font-style:italic}.num{color:#080}.attr{color:#795da3}
.score{font-size:32px;font-weight:700;color:#166534}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}.card{border:1px solid #e2e8f0;border-radius:8px;padding:12px}.ok{color:#15803d}.bad{color:#b91c1c}.muted{color:#64748b;font-size:13px}.copy-toast{position:fixed;right:24px;bottom:24px;background:#0f172a;color:#fff;padding:8px 12px;border-radius:7px;font-size:12px;z-index:250;opacity:0;transition:.18s}.copy-toast.show{opacity:1}
@media(max-width:980px){.meta{display:none}.brand{font-size:13px}.btn{padding:6px 8px}.grid{grid-template-columns:1fr}.collapse-controls{left:calc(var(--split) - 54px)}}
</style>
</head>
<body>
<div class="topbar"><div class="brand">Jupyter 模拟考试</div><div id="examMeta" class="meta">正在读取考试信息...</div><div class="spacer"></div><div id="timer" class="timer">--:--</div><button id="answerToggle" class="btn answer" onclick="openAnswer()">查看答案</button><button id="pathToggle" class="btn" onclick="togglePathPanel()">路径结构</button><button class="btn" onclick="resetSplit()">恢复比例</button><button class="btn" onclick="openJupyterDirect()">单独打开 Jupyter</button><button id="submitBtn" class="btn submit" onclick="submitExam()">保存后提交</button></div>
<div id="workspace" class="workspace"><section class="pane left"><div id="questionLoading" class="loading">正在加载题目...</div><iframe id="questionFrame" title="考试题目"></iframe></section><div id="splitter" class="splitter"></div><section class="pane right"><div id="jupyterLoading" class="loading">正在连接 Jupyter Notebook...</div><div id="jupyterNotice" class="notice">如果右侧一直空白，可点击顶部“单独打开 Jupyter”。</div><iframe id="jupyterFrame" title="Jupyter Notebook"></iframe></section><div id="collapseControls" class="collapse-controls"><button id="leftToggle" class="collapse-btn" onclick="toggleLeft()" title="收起题目" aria-label="收起题目">&lt;&lt;</button><button id="rightToggle" class="collapse-btn" onclick="toggleRight()" title="收起 Jupyter" aria-label="收起 Jupyter">&gt;&gt;</button></div></div>
<div id="pathPanel" class="path-panel"><div class="path-head"><div class="path-title">当前考试路径结构</div><button class="btn" style="color:#334155;background:#fff;border-color:#cbd5e1;padding:4px 8px" onclick="refreshPathTree()">刷新</button><button class="path-close" onclick="togglePathPanel(false)">×</button></div><div class="path-help">从 Jupyter 考试根目录开始显示。当前 Notebook 读取同目录文件时可直接使用相对路径。</div><div class="path-body"><div class="path-root">📁 考试根目录 /</div><div id="pathTree" class="path-status">正在读取...</div></div></div>
<div id="answerMask" class="answer-mask" onclick="if(event.target===this)closeAnswer()"><div class="answer-dialog"><div class="answer-head"><div id="answerTitle" class="answer-title">参考答案</div><div id="answerEncoding" class="muted"></div><button class="btn" onclick="closeAnswer()">关闭</button></div><div class="answer-toolbar"><button id="codeModeBtn" class="mode active" onclick="setAnswerMode('code')">答案代码</button><button id="fullModeBtn" class="mode" onclick="setAnswerMode('full')">完整答案</button><button class="mode" onclick="copyAnswerCode()">复制代码</button></div><div class="answer-body"><pre id="answerText" class="answer-code">正在读取...</pre></div></div></div>
<div id="resultMask" class="result-mask"><div class="result-dialog"><div class="result-head"><div class="result-title">考试已提交</div></div><div id="resultBody" class="result-body"></div><div class="result-actions"><button class="btn primary" onclick="closeResult()">确定</button><button class="btn" onclick="openSubmittedReview()">查看已提交答卷</button><button class="btn" onclick="location.href='/practice.html'">返回训练系统</button></div></div></div>
<div id="copyToast" class="copy-toast">已复制</div>
<script>
let session=null,lastReport=null,tickId=null,leftHidden=false,rightHidden=false,pathPanelOpen=false,answerRaw='',answerCode='',answerMode='code';
const workspace=document.getElementById('workspace'),splitter=document.getElementById('splitter'),questionFrame=document.getElementById('questionFrame'),jupyterFrame=document.getElementById('jupyterFrame'),leftToggle=document.getElementById('leftToggle'),rightToggle=document.getElementById('rightToggle'),pathPanel=document.getElementById('pathPanel'),pathToggle=document.getElementById('pathToggle'),answerMask=document.getElementById('answerMask'),answerText=document.getElementById('answerText');
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
async function api(method,path,body){const o={method,cache:'no-store',headers:{}};if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}const r=await fetch(path,o);let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.message||('HTTP '+r.status));return d}
function fmt(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function startTimer(){clearInterval(tickId);const run=()=>{if(!session)return;const left=(session.deadline_ms-Date.now())/1000,el=document.getElementById('timer');el.textContent=left<=0?'时间到':fmt(left);el.classList.toggle('danger',left<=300)};run();tickId=setInterval(run,1000)}
function loadQuestion(qid){questionFrame.src=encodeURI('/人工智能训练师三级素材/人工智能训练师三级考试平台模拟界面/'+qid+'.html');questionFrame.onload=()=>{document.getElementById('questionLoading').classList.add('hidden');try{const d=questionFrame.contentDocument,r=d.querySelector('.right-column'),l=d.querySelector('.left-column'),c=d.querySelector('.container');if(r)r.style.display='none';if(l){l.style.flex='1 1 100%';l.style.width='100%';l.style.maxWidth='none';l.style.padding='18px 22px'}if(c){c.style.display='block';c.style.height='100vh'}d.documentElement.style.overflow='auto';d.body.style.overflow='auto'}catch(_){}}}
function loadJupyter(url){jupyterFrame.src=url;jupyterFrame.onload=()=>document.getElementById('jupyterLoading').classList.add('hidden');setTimeout(()=>{if(!document.getElementById('jupyterLoading').classList.contains('hidden'))document.getElementById('jupyterNotice').classList.add('show')},7000)}
async function init(){try{const s=await api('GET','/api/exam/status');if(!s.active||!s.session){document.getElementById('examMeta').textContent='当前没有正在进行的考试';document.getElementById('submitBtn').disabled=true;pathToggle.disabled=true;document.getElementById('answerToggle').disabled=true;document.getElementById('questionLoading').textContent='没有活动考试，请返回训练系统开始模拟考试';document.getElementById('jupyterLoading').textContent='没有活动考试';return}session=s.session;document.title=session.qid+' - Jupyter 模拟考试';document.getElementById('examMeta').textContent=`${session.qid} · ${session.notebook} · ${session.duration_minutes} 分钟`;loadQuestion(session.qid);loadJupyter(session.jupyter_url);startTimer();const saved=parseFloat(localStorage.getItem('ai3_exam_split_ratio')||'42');if(Number.isFinite(saved))setSplit(saved);syncCollapse()}catch(e){document.getElementById('examMeta').textContent='加载失败：'+e.message}}
function setSplit(p){p=Math.max(15,Math.min(85,p));document.documentElement.style.setProperty('--split',p+'%');localStorage.setItem('ai3_exam_split_ratio',String(p))}function resetSplit(){leftHidden=false;rightHidden=false;syncCollapse();setSplit(42)}function syncCollapse(){if(leftHidden&&rightHidden)rightHidden=false;workspace.classList.toggle('left-hidden',leftHidden);workspace.classList.toggle('right-hidden',rightHidden);leftToggle.textContent='<<';rightToggle.textContent='>>';leftToggle.title=leftHidden?'展开题目':'收起题目';leftToggle.setAttribute('aria-label',leftToggle.title);rightToggle.title=rightHidden?'展开 Jupyter':'收起 Jupyter';rightToggle.setAttribute('aria-label',rightToggle.title);leftToggle.classList.toggle('active',leftHidden);rightToggle.classList.toggle('active',rightHidden)}function toggleLeft(){leftHidden=!leftHidden;if(leftHidden)rightHidden=false;syncCollapse()}function toggleRight(){rightHidden=!rightHidden;if(rightHidden)leftHidden=false;syncCollapse()}function openJupyterDirect(){if(session&&session.jupyter_url)window.open(session.jupyter_url,'ai_trainer_jupyter_direct')}
function jupyterOrigin(){try{return session&&session.jupyter_url?new URL(session.jupyter_url).origin:''}catch(_){return ''}}function encodeApiPath(p){return String(p||'').split('/').filter(Boolean).map(encodeURIComponent).join('/')}function hiddenFile(n,p){return n==='_exam_session.json'||n==='jupyter.log'||n==='score.json'||String(p||'').split('/').includes('.ipynb_checkpoints')}async function contents(p=''){const r=await fetch(jupyterOrigin()+'/api/contents/'+encodeApiPath(p),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}async function buildTree(p='',depth=0){const d=await contents(p),list=(d.content||[]).filter(x=>!hiddenFile(x.name,x.path));list.sort((a,b)=>(a.type==='directory'?0:1)-(b.type==='directory'?0:1)||String(a.name).localeCompare(String(b.name),'zh-CN'));const out=[];for(const x of list){const n={...x,depth,children:[]};if(x.type==='directory'&&depth<8)try{n.children=await buildTree(x.path,depth+1)}catch(_){}out.push(n)}return out}function renderTree(nodes){let h='';for(const n of nodes){const dir=n.type==='directory',cur=!dir&&session&&n.path===session.notebook;h+=`<div class="tree-row">${'<span class="tree-indent"></span>'.repeat(n.depth+1)}<span class="tree-icon">${dir?'📁':'📄'}</span><span class="tree-name" ${dir?'':`onclick="copyPath('${String(n.path).replace(/'/g,"\\'")}')"`}>${esc(n.name)}</span>${cur?'<span class="tree-current">当前 Notebook</span>':''}${dir?'':`<button class="tree-copy" onclick="copyPath('${String(n.path).replace(/'/g,"\\'")}')">复制</button>`}</div>`;if(n.children)h+=renderTree(n.children)}return h}async function refreshPathTree(){const b=document.getElementById('pathTree');b.className='path-status';b.textContent='正在读取...';try{const n=await buildTree();b.className='';b.innerHTML=`<div class="tree-row" style="margin:5px 0 7px 18px">📓 当前 ipynb：<b>${esc(session.notebook)}</b></div>`+renderTree(n)}catch(e){b.textContent='读取失败：'+e.message}}function togglePathPanel(force){pathPanelOpen=typeof force==='boolean'?force:!pathPanelOpen;pathPanel.classList.toggle('show',pathPanelOpen);pathToggle.classList.toggle('active',pathPanelOpen);pathToggle.textContent=pathPanelOpen?'隐藏路径':'路径结构';if(pathPanelOpen)refreshPathTree()}async function copyPath(p){try{await navigator.clipboard.writeText(p);showToast('已复制：'+p)}catch(_){}}
function scoreDecodedText(s){let b=0;for(const ch of s){if(ch==='\uFFFD')b+=20;if(ch==='Ã'||ch==='Â'||ch==='锟')b+=3}return b}function decodeText(buf){const bytes=new Uint8Array(buf),c=[];try{c.push({text:new TextDecoder('utf-8',{fatal:true}).decode(bytes),encoding:'UTF-8'})}catch(_){}try{c.push({text:new TextDecoder('gb18030',{fatal:true}).decode(bytes),encoding:'GB18030/GBK'})}catch(_){}if(!c.length)return{text:new TextDecoder('utf-8').decode(bytes),encoding:'UTF-8'};c.sort((a,b)=>scoreDecodedText(a.text)-scoreDecodedText(b.text));return c[0]}function extractCode(md){const a=[],re=/```(?:python|py)?\s*\n([\s\S]*?)```/gi;let m;while((m=re.exec(md))!==null)a.push(m[1].trim());return a.join('\n\n# ─────────────────────────────────────\n\n')}
const KW=new Set('and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield True False None'.split(' '));function py(code){let out='',i=0;const add=(t,c='')=>out+=c?`<span class="${c}">${esc(t)}</span>`:esc(t);while(i<code.length){const ch=code[i];if(ch==='#'){let j=code.indexOf('\n',i);if(j<0)j=code.length;add(code.slice(i,j),'com');i=j;continue}if(ch==='\''||ch==='"'){let j=i+1;while(j<code.length){if(code[j]==='\\'){j+=2;continue}if(code[j]===ch){j++;break}j++}add(code.slice(i,j),'str');i=j;continue}if(/[A-Za-z_]/.test(ch)){let j=i+1;while(j<code.length&&/[A-Za-z0-9_]/.test(code[j]))j++;const w=code.slice(i,j);add(w,KW.has(w)?'kw':(i>0&&code[i-1]==='.'?'attr':''));i=j;continue}if(/[0-9]/.test(ch)){let j=i+1;while(j<code.length&&/[0-9._]/.test(code[j]))j++;add(code.slice(i,j),'num');i=j;continue}add(ch);i++}return out}function renderAnswer(){document.getElementById('codeModeBtn').classList.toggle('active',answerMode==='code');document.getElementById('fullModeBtn').classList.toggle('active',answerMode==='full');answerText.className='answer-code'+(answerMode==='full'?' full':'');if(answerMode==='code')answerText.innerHTML=answerCode?py(answerCode):'没有识别到代码块';else answerText.textContent=answerRaw}function setAnswerMode(m){answerMode=m;renderAnswer()}async function openAnswer(){if(!session)return;answerMask.classList.add('show');document.getElementById('answerTitle').textContent=session.qid+' 参考答案';answerText.textContent='正在读取...';try{const r=await fetch('/人工智能训练师三级素材/操作题答案/'+encodeURIComponent(session.qid)+'_答案.md',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=decodeText(await r.arrayBuffer());answerRaw=d.text;answerCode=extractCode(answerRaw);document.getElementById('answerEncoding').textContent='编码：'+d.encoding;answerMode='code';renderAnswer()}catch(e){answerText.textContent='读取失败：'+e.message}}function closeAnswer(){answerMask.classList.remove('show')}async function copyAnswerCode(){const t=answerMode==='code'?answerCode:answerRaw;if(t){await navigator.clipboard.writeText(t);showToast('已复制答案代码')}}
function showToast(t){const x=document.getElementById('copyToast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1400)}
async function submitExam(){if(!session)return;if(!confirm('请先在右侧 Jupyter Notebook 中按 Ctrl+S 保存。\n\n提交后将自动重新运行 Notebook 进行验证。'))return;const b=document.getElementById('submitBtn');b.disabled=true;b.textContent='正在自动运行并评分...';try{const d=await api('POST','/api/exam/submit',{session_id:session.id});clearInterval(tickId);lastReport=d.report;pathToggle.disabled=true;b.textContent='已提交';document.getElementById('examMeta').textContent=`${session.qid} · 已提交 · 静态答卷`;jupyterFrame.src='/exam_review.html?id='+encodeURIComponent(d.report.id)+'&embed=1';document.getElementById('jupyterLoading').classList.add('hidden');showResult(d.report)}catch(e){alert('提交失败：'+e.message);b.disabled=false;b.textContent='保存后提交'}}
function showResult(r){const checks=(r.checks||[]).map(x=>`<div class="${x.ok?'ok':'bad'}">${x.ok?'✓':'✗'} ${esc(x.label)}</div>`).join('');const autoErr=(r.auto_errors||[]).map(x=>`<div class="bad">Cell ${x.cell}: ${esc(x.ename)} ${esc(x.evalue)}</div>`).join('');const engine=r.auto_engine_error?`<div class="bad">自动运行引擎：${esc(r.auto_engine_error)}</div>`:'';const parts=r.score_parts||{};document.getElementById('resultBody').innerHTML=`<div class="score">${esc(r.score)} / 100</div><div class="muted">${esc(r.score_note||'自动初评')}</div><div class="grid"><div class="card"><b>关键代码检查</b>${checks||'<div class="muted">暂无规则</div>'}</div><div class="card"><b>自动运行验证</b><div>成功 Cell：${esc(r.auto_successful_cells)} / ${esc(r.code_cells)}</div><div>自动执行 Cell：${esc(r.auto_executed_cells)} / ${esc(r.code_cells)}</div><div>原 Notebook 保存的执行记录：${esc(r.saved_executed_cells)} / ${esc(r.code_cells)}（仅参考，不扣分）</div><div>剩余下划线占位：${esc(r.placeholders)}</div>${engine}${autoErr||'<div class="ok">✓ 自动运行未检测到异常</div>'}</div></div><div class="card" style="margin-top:14px"><b>计分构成</b><div>代码结构：${esc(parts.structure??0)} / 60</div><div>占位完成：${esc(parts.placeholders??0)} / 15</div><div>自动执行：${esc(parts.execution??0)} / 15</div><div>运行无异常：${esc(parts.runtime??0)} / 10</div><div style="margin-top:8px">用时：${fmt(r.elapsed_seconds||0)}</div></div><div class="muted" style="margin-top:12px">点击“确定”后可继续在当前页面查看已提交的静态答卷。</div>`;document.getElementById('resultMask').classList.add('show')}
function closeResult(){document.getElementById('resultMask').classList.remove('show')}function openSubmittedReview(){if(lastReport)window.open('/exam_review.html?id='+encodeURIComponent(lastReport.id),'_blank')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(answerMask.classList.contains('show'))closeAnswer();else if(document.getElementById('resultMask').classList.contains('show'))closeResult();else if(pathPanelOpen)togglePathPanel(false)}});document.addEventListener('pointerdown',e=>{if(pathPanelOpen&&!pathPanel.contains(e.target)&&e.target!==pathToggle)togglePathPanel(false)});
let dragging=false;splitter.addEventListener('pointerdown',e=>{dragging=true;splitter.classList.add('dragging');splitter.setPointerCapture(e.pointerId)});splitter.addEventListener('pointermove',e=>{if(!dragging)return;const r=workspace.getBoundingClientRect();setSplit((e.clientX-r.left)/r.width*100)});splitter.addEventListener('pointerup',()=>{dragging=false;splitter.classList.remove('dragging')});splitter.addEventListener('dblclick',resetSplit);
init();
</script>
