};

];
const Q=[];for(const u of UNITS){const count=u.count||5;for(let i=1;i<=count;i++){const id=`${u.id}.${i}`,d=DETAILS[id]||{};Q.push({id,unit:u.id,chapter:u.name,title:d.title||`${id} 实操题`,tags:d.tags||[],req:d.req||[],blanks:d.blanks||[],taskText:d.taskText||'',importRequired:!!d.importRequired,generatedRequired:id.startsWith('6.'),notebook:d.notebook||BASE+id+'/'+id+'.ipynb',answer:d.answer||ANSW+id+'_答案.md',notebookAvailable:null})}}

function loadUnitState(){try{return JSON.parse(localStorage.getItem(UNIT_KEY)||'{}')}catch(e){return{}}}
function saveUnitState(s){localStorage.setItem(UNIT_KEY,JSON.stringify(s))}
function norm(s){return (s||'').replace(/\s+/g,'').replace(/"/g,"'").replace(/;$/,'')}
function accepted(b,v){return [b.a,...(b.alt||[])].some(x=>norm(x)===norm(v))}
function hit(f,ok){const s=loadStats();s[f]=s[f]||{right:0,total:0};s[f].total++;if(ok)s[f].right++;saveStats(s)}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function guideModuleFor(q=current){if(guidePinnedUnit==='__overview__')return null;if(guidePinnedUnit&&window.COMPETITION_GUIDANCE?.modules?.[guidePinnedUnit])return guidePinnedUnit;if(q?.unit&&window.COMPETITION_GUIDANCE?.modules?.[q.unit])return q.unit;if(q?.id?.startsWith('5.1.')){const n=Number(q.id.split('.')[2]);const id='6.'+n;if(window.COMPETITION_GUIDANCE?.modules?.[id])return id}return null}
function openGuideModule(id){guidePinnedUnit=id;setMode('guide')}
function showGuideOverview(){guidePinnedUnit='__overview__';setMode('guide')}
function goGuideQuestion(id){if(!Q.some(q=>q.id===id))return;guidePinnedUnit=null;selectQ(id);setMode('guide')}
function renderGuideButtons(ids,strong=false){return (ids||[]).map(id=>`<button class="guide-qbtn ${strong?'strong':''}" onclick="goGuideQuestion('${esc(id)}')">${esc(id)}</button>`).join('')}
function renderGuide(){const data=window.COMPETITION_GUIDANCE;if(!data){guideArea.innerHTML='<div class="hint">学习指导数据未加载。</div>';return}const moduleId=guideModuleFor(current);if(!moduleId){const cards=Object.entries(data.modules).map(([id,g])=>`<div class="guide-card guide-overview-card" onclick="openGuideModule('${id}')"><h3>模块 ${esc(g.code)} · ${esc(g.name)}</h3><div class="guide-meta"><span class="guide-badge score">${g.score} 分</span><span class="guide-badge">${esc(g.days)}</span></div><p>${esc(g.goal)}</p><div class="muted">必做：${esc(g.must.join('、'))}</div></div>`).join('');guideArea.innerHTML=`<div class="guide-hero"><h3>${esc(data.overview.title)}</h3><p>${esc(data.overview.subtitle)}</p></div><div class="guide-grid">${cards}</div><div class="guide-card" style="margin-top:12px"><h3>统一训练原则</h3><ol class="guide-list">${data.overview.principles.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;return}const g=data.modules[moduleId],focus=(current.unit===moduleId||current.id.startsWith('5.1.'))?current:null;const flow=g.workflow.map((x,i)=>`<span class="guide-step">${esc(x)}</span>${i<g.workflow.length-1?'<span class="guide-arrow">→</span>':''}`).join('');const apis=g.apiGroups.map(x=>`<div class="guide-api-group"><b>${esc(x.title)}</b><div class="guide-pills">${x.items.map(api=>`<span class="guide-pill">${esc(api)}</span>`).join('')}</div></div>`).join('');const focusHtml=focus?`<div class="guide-card guide-focus"><h3>当前题怎么练 · ${esc(focus.id)} ${esc(focus.title)}</h3><div class="guide-pills">${(focus.tags||[]).map(t=>`<span class="guide-pill">${esc(t)}</span>`).join('')}</div><ol class="guide-list">${(focus.req||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="hint">建议：第一遍可对照本页任务链完成；第二遍关闭指导只看题面；第三遍限时并使用自动评分核对交付文件。</div></div>`:'';guideArea.innerHTML=`<div class="guide-hero"><div class="toolbar" style="margin-top:0"><button class="btn small" onclick="showGuideOverview()">← 五模块总览</button></div><h3>模块 ${esc(g.code)} · ${esc(g.name)}</h3><div class="guide-meta"><span class="guide-badge score">${g.score} 分</span><span class="guide-badge">${esc(g.days)}</span></div><p>${esc(g.goal)}</p></div><div class="guide-card"><h3>固定任务链</h3><div class="guide-flow">${flow}</div></div><div class="guide-grid" style="margin-top:12px"><div class="guide-card"><h3>高频 API / 技术点</h3>${apis}</div><div class="guide-card"><h3>练习顺序</h3><p><b>必做</b></p><div class="guide-pills">${renderGuideButtons(g.must)}</div><p><b>强化</b></p><div class="guide-pills">${renderGuideButtons(g.strengthen,true)}</div><h3>考场策略</h3><p>${esc(g.exam)}</p></div></div><div class="guide-card" style="margin-top:12px"><h3>常见失分点检查</h3><ul class="guide-list">${g.checkpoints.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div style="margin-top:12px">${focusHtml}</div>`}
function renderExam(){examArea.innerHTML=`<h3>Jupyter Notebook 模拟考试</h3><div class="hint">正在载入模拟考试组件...</div>`}
function renderFill(){if(!current.blanks.length){fillArea.innerHTML=`<div class="hint"><b>${esc(current.id)}</b> 暂未制作网页代码填空模板。该题已导入左侧题库，建议优先使用“模拟考试”查看原始题面和素材。</div><div class="toolbar"><a class="btn" href="${current.answer}" target="_blank">查看参考答案</a></div>`;return}fillArea.innerHTML=`<h3>代码填空</h3><div class="muted">先凭记忆填写，再检查。这里只训练高频关键表达式，完整流程请用“模拟考试”。</div>${current.blanks.map((b,i)=>`<div style="margin-top:12px"><div><b>${i+1}. ${esc(b.p)}</b></div><input id="blank_${i}" class="blank" autocomplete="off" placeholder="输入 Python 表达式"><div id="fb_${i}" class="feedback"></div></div>`).join('')}<div class="toolbar"><button class="btn primary" onclick="checkFill()">检查答案</button><button class="btn" onclick="clearFill()">清空</button><a class="btn" href="${current.notebook}" download>下载原始 Notebook</a><a class="btn" href="${current.answer}" target="_blank">查看参考答案</a></div>`}
function checkFill(){current.blanks.forEach((b,i)=>{const el=document.getElementById('blank_'+i),fb=document.getElementById('fb_'+i),ok=accepted(b,el.value);el.classList.toggle('ok',ok);el.classList.toggle('bad',!ok);fb.className='feedback '+(ok?'ok':'bad');fb.textContent=ok?'正确':'参考：'+b.a;hit(b.f,ok)})}
function clearFill(){current.blanks.forEach((_,i)=>{const e=document.getElementById('blank_'+i),f=document.getElementById('fb_'+i);if(e){e.value='';e.className='blank'}if(f)f.textContent=''})}
function funcBank(){return Object.values(DETAILS).flatMap(x=>x.blanks||[])}
function renderFunc(){const bank=funcBank();if(!bank.length){funcArea.innerHTML='<div class="hint">暂无函数速练数据。</div>';return}funcIndex=((funcIndex%bank.length)+bank.length)%bank.length;const b=bank[funcIndex];funcArea.innerHTML=`<h3>函数速练</h3><div class="func-card"><div class="func-prompt">${esc(b.p)}</div><input id="funcInput" class="func-answer" autocomplete="off" placeholder="写出核心函数或表达式"><div id="funcFb" class="feedback"></div><div class="toolbar"><button class="btn primary" onclick="checkFunc()">检查</button><button class="btn" onclick="nextFunc()">下一题</button></div></div>`}
function checkFunc(){const b=funcBank()[funcIndex],v=document.getElementById('funcInput').value,ok=accepted(b,v),fb=document.getElementById('funcFb');fb.className='feedback '+(ok?'ok':'bad');fb.textContent=ok?'正确':'参考：'+b.a;hit(b.f,ok)}function nextFunc(){funcIndex++;renderFunc()}
function renderStats(){const s=loadStats(),vals=Object.values(s),total=vals.reduce((a,b)=>a+b.total,0),right=vals.reduce((a,b)=>a+b.right,0),rate=total?Math.round(right*100/total):0;stats.innerHTML=`<div class="stat"><b>${total}</b>练习</div><div class="stat"><b>${right}</b>正确</div><div class="stat"><b>${rate}%</b>正确率</div>`;const weak=Object.entries(s).filter(([,v])=>v.total>0).sort((a,b)=>a[1].right/a[1].total-b[1].right/b[1].total).slice(0,8);weakList.innerHTML=weak.length?weak.map(([k,v])=>`<div class="weak"><b>${esc(k)}</b><div class="muted">${v.right}/${v.total} · ${Math.round(v.right*100/v.total)}%</div></div>`).join(''):'<div class="muted">完成代码填空或函数速练后显示</div>'}
function renderCheats(){const x=(document.getElementById('cheatSearch').value||'').toLowerCase();cheats.innerHTML=CHEATS.filter(([a,b])=>(a+' '+b).toLowerCase().includes(x)).map(([a,b])=>`<div style="margin:8px 0"><b>${esc(a)}</b><br><code>${esc(b)}</code></div>`).join('')}
renderQuestionList();renderTask();renderStats();renderCheats();renderExam();hydrateCatalog();
</script>
