<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>人工智能训练师三级 - 实操训练系统</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f5f7fb}#appFrame{display:block;width:100%;height:100%;border:0}
.mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.62);z-index:99999;padding:28px;box-sizing:border-box}.mask.show{display:flex}.panel{width:min(1180px,100%);max-height:calc(100vh - 56px);margin:auto;background:#fff;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}.head{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#0f172a;color:#fff}.title{font-weight:700;flex:1}.encoding{font-size:12px;color:#cbd5e1}.close{border:1px solid #475569;background:#1e293b;color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer}.body{flex:1;overflow:auto;padding:20px}#answerText{margin:0;white-space:pre-wrap;word-break:break-word;font-family:Consolas,"Microsoft YaHei",monospace;font-size:14px;line-height:1.75;color:#1f2937}.answer-error{color:#b91c1c}
.records{display:grid;gap:10px}.record{border:1px solid #e2e8f0;border-radius:9px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.record-title{font-weight:700}.record-meta{font-size:12px;color:#64748b;margin-top:5px;line-height:1.6}.badge{display:inline-block;border-radius:12px;padding:2px 7px;font-size:11px;margin-left:7px}.active{background:#dbeafe;color:#1d4ed8}.submitted{background:#dcfce7;color:#166534}.unfinished{background:#fef3c7;color:#92400e}.record-actions{display:flex;gap:7px}.rbtn{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:6px;padding:6px 10px;cursor:pointer}.rbtn.primary{background:#2563eb;border-color:#2563eb;color:#fff}.empty{padding:30px;text-align:center;color:#64748b}
</style>
</head>
<body>
<iframe id="appFrame" src="%E5%AE%9E%E6%93%8D%E8%AE%AD%E7%BB%83%E7%B3%BB%E7%BB%9F.html"></iframe>
<div id="answerMask" class="mask"><div class="panel"><div class="head"><div id="answerTitle" class="title">参考答案</div><div id="answerEncoding" class="encoding"></div><button class="close" onclick="closeAnswer()">关闭</button></div><div class="body"><pre id="answerText">正在读取...</pre></div></div></div>
<div id="recordsMask" class="mask"><div class="panel"><div class="head"><div class="title">模拟考试作答记录</div><button class="close" onclick="closeRecords()">关闭</button></div><div class="body"><div id="recordsBox" class="records"><div class="empty">正在读取...</div></div></div></div></div>
<script>
const frame=document.getElementById('appFrame'),answerMask=document.getElementById('answerMask'),recordsMask=document.getElementById('recordsMask'),textBox=document.getElementById('answerText'),titleBox=document.getElementById('answerTitle'),encodingBox=document.getElementById('answerEncoding');
let examActive=false,activeSession=null,examTimer=null,examPoll=null;
function escHtml(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function closeAnswer(){answerMask.classList.remove('show')}function closeRecords(){recordsMask.classList.remove('show')}
answerMask.addEventListener('click',e=>{if(e.target===answerMask)closeAnswer()});recordsMask.addEventListener('click',e=>{if(e.target===recordsMask)closeRecords()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAnswer();closeRecords()}});
function scoreDecodedText(s){let bad=0;for(const ch of s){if(ch==='\uFFFD')bad+=20;if(ch==='Ã'||ch==='Â'||ch==='锟'||ch==='烫'||ch==='屯')bad+=3}return bad}
function decodeAnswer(buf){const bytes=new Uint8Array(buf),c=[];try{c.push({text:new TextDecoder('utf-8',{fatal:true}).decode(bytes),encoding:'UTF-8'})}catch(_){}try{c.push({text:new TextDecoder('gb18030',{fatal:true}).decode(bytes),encoding:'GB18030/GBK'})}catch(_){}if(!c.length)return{text:new TextDecoder('utf-8').decode(bytes),encoding:'UTF-8（容错）'};c.sort((a,b)=>scoreDecodedText(a.text)-scoreDecodedText(b.text));return c[0]}
async function openAnswer(url,label){if(examActive){alert('模拟考试正在进行。请在考试工作台中使用“查看答案”。');return}answerMask.classList.add('show');titleBox.textContent=label||'参考答案';encodingBox.textContent='';textBox.className='';textBox.textContent='正在读取答案...';try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' '+r.statusText);const d=decodeAnswer(await r.arrayBuffer());encodingBox.textContent='编码：'+d.encoding;textBox.textContent=d.text}catch(err){textBox.className='answer-error';textBox.textContent='答案读取失败：'+err.message+'\n\n地址：'+url}}
async function api(method,path,body){const opt={method,cache:'no-store',headers:{}};if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}const r=await fetch(path,opt);let data={};try{data=await r.json()}catch(_){}if(!r.ok){const e=new Error(data.message||('HTTP '+r.status));e.data=data;throw e}return data}
function childDoc(){return frame.contentDocument}function childWin(){return frame.contentWindow}
function currentQuestion(){try{return childWin().getCurrentQuestion?childWin().getCurrentQuestion():null}catch(_){return null}}
function currentQid(){const q=currentQuestion();if(q&&q.id)return q.id;const d=childDoc(),el=d&&d.querySelector('.qitem.active .qid');if(el)return el.textContent.trim();const h=d&&d.querySelector('#taskHead h2'),m=h&&h.textContent.match(/\d+\.\d+\.\d+/);return m?m[0]:''}
function answerUrlFor(qid){return '人工智能训练师三级素材/操作题答案/'+qid+'_答案.md'}
function applyExamLayout(on){const d=childDoc();if(!d)return;const right=d.querySelector('.right'),layout=d.querySelector('.layout'),headToolbar=d.querySelector('#taskHead .toolbar');if(right)right.style.display=on?'none':'';if(layout)layout.style.gridTemplateColumns=on?'300px minmax(0,1fr)':'';if(headToolbar)headToolbar.style.display=on?'none':''}
function setExamLock(lock){const d=childDoc();if(!d)return;d.querySelectorAll('.tab').forEach(btn=>{if(btn.dataset.mode!=='exam')btn.disabled=lock});d.querySelectorAll('.qitem').forEach(x=>x.style.pointerEvents=lock?'none':'');const s=d.getElementById('qSearch');if(s)s.disabled=lock}
function examStateBox(){const d=childDoc();return d&&d.getElementById('nbExamState')}function examReportBox(){const d=childDoc();return d&&d.getElementById('nbExamReport')}
function formatTime(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function startExamTimer(){clearInterval(examTimer);const tick=()=>{const d=childDoc(),el=d&&d.getElementById('nbExamTimer');if(!el||!activeSession)return;const left=Math.max(0,(activeSession.deadline_ms-Date.now())/1000);el.textContent=formatTime(left);if(left<=0){el.style.color='#b91c1c';el.textContent='时间到：请立即保存并提交'}};tick();examTimer=setInterval(tick,1000)}
function stopExamPolling(){if(examPoll){clearInterval(examPoll);examPoll=null}}function startExamPolling(){stopExamPolling();examPoll=setInterval(()=>{if(examActive)refreshExamStatus()},2000)}
function examWorkspaceUrl(){return '/exam_workspace.html'+(activeSession?'?session='+encodeURIComponent(activeSession.id):'')}
function renderActiveSession(s){const box=examStateBox();if(!box)return;activeSession=s;examActive=true;setExamLock(true);box.innerHTML=`<div style="border:1px solid #bfdbfe;background:#eff6ff;border-radius:8px;padding:14px;margin-top:12px"><div><b>考试进行中：</b>${escHtml(s.qid)}</div><div style="margin-top:8px">剩余时间：<span id="nbExamTimer" style="font-size:26px;font-weight:700;color:#1d4ed8"></span></div><div class="muted" style="margin-top:8px">工作目录：${escHtml(s.workspace)}</div><div class="toolbar"><button class="btn primary" onclick="parent.reopenExamWorkspace()">重新打开考试工作台</button><button class="btn" onclick="parent.openExamRecords()">查看作答记录</button><button class="btn" onclick="parent.openDirectJupyter()">单独打开 Jupyter</button><button class="btn ok" onclick="parent.submitJupyterExam()">保存后提交考试</button></div></div>`;startExamTimer();startExamPolling()}
function renderIdleExam(system,lastResult){const box=examStateBox();if(!box)return;activeSession=null;examActive=false;clearInterval(examTimer);stopExamPolling();setExamLock(false);const q=currentQuestion(),qid=currentQid(),jupyterReady=system&&system.notebook_installed,materialReady=!q||q.notebookAvailable!==false,canStart=jupyterReady&&materialReady;const materialText=q&&q.notebookAvailable===false?'该题原始素材未提供 .ipynb，因此不启用 Jupyter 模拟考试。仍可在左侧查看题目，并通过“作答记录”查看历史记录。':q&&q.notebookAvailable===null?'正在检测该题是否包含 Notebook 素材...':'使用原始 .ipynb 与配套数据进入标准 Jupyter Notebook。';box.innerHTML=`<div style="border:1px solid #e2e8f0;border-radius:8px;padding:14px;margin-top:12px"><div><b>当前题目：</b>${escHtml(qid)}</div><div class="muted" style="margin-top:6px">Python：${escHtml(system?.python||'检测中')} · Jupyter：${jupyterReady?'已安装':'未安装'} · Notebook端口：${escHtml(system?.jupyter_port||7001)}</div><div class="toolbar"><button class="btn primary" ${canStart?'':'disabled'} onclick="parent.startJupyterExam()">开始模拟考试</button><button class="btn" onclick="parent.openExamRecords()">查看作答记录</button></div><div class="hint">${escHtml(materialText)}</div></div>`;if(lastResult&&lastResult.qid===qid)renderExamReport(lastResult)}
function renderExamReport(r){const box=examReportBox();if(!box)return;const checks=(r.checks||[]).map(x=>`<div style="padding:4px 0">${x.ok?'✓':'✗'} ${escHtml(x.label)}</div>`).join(''),errs=(r.auto_errors||r.errors||[]).map(x=>`<div>Cell ${x.cell}: ${escHtml(x.ename)} ${escHtml(x.evalue)}</div>`).join(''),parts=r.score_parts||{};box.innerHTML=`<div style="border:1px solid #d1fae5;background:#f0fdf4;border-radius:8px;padding:14px;margin-top:14px"><div style="font-size:22px;font-weight:700">自动初评：${escHtml(r.score)} / 100</div><div class="muted">${escHtml(r.score_note||'仅用于训练自检')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px"><div><b>${checks?'关键代码检查':'完成度检查'}</b>${checks||`<div class="muted">按原题占位完成度与实际运行结果进行通用初评</div>`}</div><div><b>自动运行验证</b><div>成功 Cell：${escHtml(r.auto_successful_cells??r.executed_cells)} / ${escHtml(r.code_cells)}</div><div>原保存执行记录：${escHtml(r.saved_executed_cells??0)} / ${escHtml(r.code_cells)}（仅参考）</div><div>剩余占位：${escHtml(r.placeholders)}</div>${r.auto_engine_error?`<div style="color:#b91c1c">${escHtml(r.auto_engine_error)}</div>`:''}${errs?`<div style="color:#b91c1c">${errs}</div>`:'<div style="color:#15803d">✓ 自动运行未检测到异常</div>'}</div></div><div class="muted" style="margin-top:10px">计分：结构 ${escHtml(parts.structure??0)}/60 · 占位 ${escHtml(parts.placeholders??0)}/15 · 自动执行 ${escHtml(parts.execution??0)}/15 · 运行无异常 ${escHtml(parts.runtime??0)}/10</div><div class="toolbar"><button class="btn" onclick="parent.openExamReview('${escHtml(r.id)}')">查看本次作答</button><button class="btn" onclick="parent.openAnswer(parent.answerUrlFor('${escHtml(r.qid)}'),'${escHtml(r.qid)} 参考答案')">查看参考答案</button></div></div>`}
async function refreshExamStatus(){try{const [status,sys]=await Promise.all([api('GET','/api/exam/status'),api('GET','/api/system/status')]);if(status.active&&status.session){const qid=currentQid();if(qid!==status.session.qid&&childWin().selectQ){childWin().selectQ(status.session.qid);return}renderActiveSession(status.session)}else renderIdleExam(sys.system,status.last_result)}catch(err){const box=examStateBox();if(box)box.innerHTML=`<div class="hint">环境检测失败：${escHtml(err.message)}</div>`}}
function renderNotebookExam(){const d=childDoc();if(!d)return;applyExamLayout(true);const area=d.getElementById('examArea');if(!area)return;area.innerHTML=`<h3>Jupyter Notebook 模拟考试</h3><div class="muted">Notebook 类实操题会复制到独立考试目录中完成，原题素材不会被修改。</div><div id="nbExamState"><div class="hint">正在检测本地考试环境...</div></div><div id="nbExamReport"></div>`;refreshExamStatus()}
async function startJupyterExam(){const q=currentQuestion(),qid=currentQid();if(!qid){alert('无法识别当前题号');return}if(q&&q.notebookAvailable===false){alert('该题原始素材没有 .ipynb，不能使用 Jupyter 模拟考试。');return}if(!confirm(`开始 ${qid} 模拟考试？\n\n系统将创建独立考试目录并启动 Jupyter Notebook。`))return;const popup=window.open('about:blank','ai_trainer_exam_workspace');if(popup)popup.document.write('<meta charset="utf-8"><title>正在启动模拟考试</title><body style="font-family:Arial;padding:30px">正在创建考试环境并启动 Jupyter Notebook，请稍候...</body>');const box=examStateBox();if(box)box.innerHTML='<div class="hint">正在复制题目素材并启动 Jupyter Notebook...</div>';try{const data=await api('POST','/api/exam/start',{qid});renderActiveSession(data.session);const u='/exam_workspace.html?session='+encodeURIComponent(data.session.id);if(popup)popup.location.href=u;else window.open(u,'_blank')}catch(err){if(popup)popup.close();if(err.data&&err.data.session)renderActiveSession(err.data.session);else if(box)box.innerHTML=`<div class="hint"><b>启动失败：</b>${escHtml(err.message)}</div>`}}
function reopenExamWorkspace(){window.open(examWorkspaceUrl(),'ai_trainer_exam_workspace')}function openDirectJupyter(){if(activeSession&&activeSession.jupyter_url)window.open(activeSession.jupyter_url,'ai_trainer_jupyter_direct')}function openExamReview(id){if(id)window.open('/exam_review.html?id='+encodeURIComponent(id),'_blank')}
async function submitJupyterExam(){if(!activeSession)return;if(!confirm('请确认已经完成当前 Notebook。\n\n提交后系统会自动重新运行 Notebook 验证。'))return;const box=examStateBox();if(box)box.innerHTML='<div class="hint">正在自动运行 Notebook 并生成评分，请稍候...</div>';try{const data=await api('POST','/api/exam/submit',{session_id:activeSession.id});examActive=false;activeSession=null;clearInterval(examTimer);stopExamPolling();setExamLock(false);if(box)box.innerHTML='<div class="answer" style="display:block">考试已提交，本次答卷已保存到考试历史。</div>';renderExamReport(data.report)}catch(err){if(box)box.innerHTML=`<div class="hint"><b>提交失败：</b>${escHtml(err.message)}</div>`}}
function statusLabel(s){return s==='active'?'进行中':s==='submitted'?'已提交':'未提交'}function formatDate(ms){if(!ms)return'-';return new Date(ms).toLocaleString()}
async function openExamRecords(){recordsMask.classList.add('show');const box=document.getElementById('recordsBox');box.innerHTML='<div class="empty">正在读取作答记录...</div>';try{const d=await api('GET','/api/exam/records'),rows=d.records||[];if(!rows.length){box.innerHTML='<div class="empty">暂无模拟考试作答记录。</div>';return}box.innerHTML=rows.map(r=>{const cls=r.status==='active'?'active':r.status==='submitted'?'submitted':'unfinished',score=r.score!=null?' · '+r.score+' 分':'';const action=r.status==='active'?`<button class="rbtn primary" onclick="parent.closeRecords();parent.reopenSpecificActive('${escHtml(r.id)}')">继续作答</button>`:`<button class="rbtn primary" onclick="parent.openExamReview('${escHtml(r.id)}')">查看作答</button>`;return `<div class="record"><div><div class="record-title">${escHtml(r.qid)} <span class="badge ${cls}">${statusLabel(r.status)}</span>${escHtml(score)}</div><div class="record-meta">${escHtml(r.notebook)}<br>开始：${escHtml(formatDate(r.started_at_ms))}${r.submitted_at_ms?'<br>提交：'+escHtml(formatDate(r.submitted_at_ms)):''}</div></div><div class="record-actions">${action}</div></div>`}).join('')}catch(e){box.innerHTML='<div class="empty">读取失败：'+escHtml(e.message)+'</div>'}}
function reopenSpecificActive(id){api('GET','/api/exam/status').then(s=>{if(s.active&&s.session&&s.session.id===id){activeSession=s.session;examActive=true;reopenExamWorkspace()}else openExamReview(id)}).catch(()=>openExamReview(id))}
function installChildHooks(){try{const d=childDoc(),w=childWin();if(!d||!w||w.__aiTrainerNotebookExamHooked)return;w.__aiTrainerNotebookExamHooked=true;try{w.renderExam=function(){renderNotebookExam()}}catch(_){}d.addEventListener('click',function(e){const tab=e.target.closest&&e.target.closest('.tab');if(tab)setTimeout(()=>{if(tab.dataset.mode==='exam')renderNotebookExam();else if(!examActive)applyExamLayout(false)},0);const a=e.target.closest&&e.target.closest('a');if(!a)return;const raw=a.getAttribute('href')||'';let pathname='';try{pathname=new URL(a.href,location.href).pathname.toLowerCase()}catch(_){pathname=raw.toLowerCase()}if(pathname.endsWith('.md')||/操作题答案/.test(raw)){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();if(examActive)alert('模拟考试正在进行，请在考试工作台中查看答案。');else openAnswer(a.href,a.textContent.trim()||'参考答案')}},true);api('GET','/api/exam/status').then(s=>{if(s.active&&s.session){examActive=true;activeSession=s.session;setExamLock(true);startExamPolling()}else{examActive=false;activeSession=null;stopExamPolling()}const activeTab=d.querySelector('.tab.active');if(activeTab&&activeTab.dataset.mode==='exam')renderNotebookExam()}).catch(()=>{const activeTab=d.querySelector('.tab.active');if(activeTab&&activeTab.dataset.mode==='exam')renderNotebookExam()})}catch(err){console.error('安装 Jupyter 模拟考试组件失败',err)}}
window.addEventListener('focus',()=>{if(examActive)refreshExamStatus()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&examActive)refreshExamStatus()});
frame.addEventListener('load',installChildHooks);
</script>
<script src="question_preview.js"></script>
</body>
</html>
