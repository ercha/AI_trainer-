name: Competition Training CI

on:
  pull_request:
    paths:
      - "生成竞赛强化训练.py"
      - "competition_syllabus_expansion.py"
      - "competition_real_exam_workflow.py"
      - "导入竞赛练习.py"
      - "competition_advanced_catalog.js"
      - "competition_guidance.js"
      - "competition_theory_bank.js"
      - "competition_theory_practice.js"
      - "competition_theory_practice.css"
      - "实操训练系统.html"
      - "serve_practice.py"
      - "tray_launcher.py"
      - "人工智能训练师三级素材/人工智能训练师三级上网素材/**/*.ipynb"
      - ".github/workflows/competition-training-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pillow
      - name: Python syntax
        run: |
          python -m py_compile "生成竞赛强化训练.py" competition_syllabus_expansion.py competition_real_exam_workflow.py "导入竞赛练习.py" serve_practice.py tray_launcher.py exam_grading.py reference_answers.py
      - name: Generate all 25 advanced exercises
        run: python "生成竞赛强化训练.py" --force
      - name: Validate generated notebooks
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          root=Path("人工智能训练师三级素材/人工智能训练师三级上网素材")
          ids=[f"6.{m}.{i}" for m in range(1,6) for i in range(1,6)]
          assert len(ids)==25
          for qid in ids:
              p=root/qid/f"{qid}.ipynb"
              assert p.is_file(), p
              nb=json.loads(p.read_text(encoding="utf-8"))
              text="\n".join("".join(c.get("source",[])) for c in nb["cells"])
              assert "# TODO " in text, f"{qid} 缺少 TODO"
              assert "_____________" in text, f"{qid} 缺少待填空"
              assert "# TODO 9-1" in text, f"{qid} 缺少输入核验练习"
              assert "# TODO 10-1" in text, f"{qid} 缺少 matplotlib 绘图练习"
              assert "data_quality_check.csv" in text, f"{qid} 缺少数据质量交付"
              assert "# TODO 10-2" in text, f"{qid} 缺少图像保存练习"
              assert re.search(r"\n\n\s*# TODO ", text), f"{qid} TODO 代码块缺少视觉分隔空行"
          cnn=(root/"6.3.1"/"6.3.1.ipynb")
          cnn_text="\n".join("".join(c.get("source",[])) for c in json.loads(cnn.read_text(encoding="utf-8"))["cells"])
          assert "\n\nclass Net" in cnn_text
          assert "\n\nfor epoch in range(8):" in cnn_text
          assert "\n\ntorch.save" in cnn_text
          print("validated",len(ids),"notebooks")
          PY
      - name: JavaScript syntax
        run: |
          node --check competition_advanced_catalog.js
          node --check competition_guidance.js
          node --check competition_theory_bank.js
          node --check competition_theory_practice.js
          node --check test_exam_ui.cjs
          python - <<'PY'
          from pathlib import Path
          html = Path("实操训练系统.html").read_text(encoding="utf-8")
          inline = html.rsplit("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/practice-inline.js").write_text(inline, encoding="utf-8")
          PY
          node --check /tmp/practice-inline.js
          node -e "global.window={};require('./competition_guidance.js');const g=window.COMPETITION_GUIDANCE;if(Object.keys(g.modules).length!==5)process.exit(1);if(Object.values(g.modules).reduce((n,m)=>n+m.must.length+m.strengthen.length,0)!==25)process.exit(1);"
          node -e "global.window={};require('./competition_theory_bank.js');const b=window.COMPETITION_THEORY_BANK;if(!b||b.counts.total!==456||b.counts.single!==304||b.counts.multi!==137||b.counts.fill!==15)process.exit(1);if(b.questions.length!==456)process.exit(1);"
